name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # Swift code uses the Foundation Models framework, which needs the macOS 26 SDK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- -e dist
